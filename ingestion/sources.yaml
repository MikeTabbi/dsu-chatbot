# DSU pages the chatbot indexes. See ingestion/README.md for how to add a source.
#
# Fields (all required):
#   url:              full https URL on desu.edu
#   topic:            short lowercase label used to group sources
#   change_frequency: slow | medium | fast  (how often the page content changes)
#   notes:            why this page is here / what questions it answers

# How often `python -m ingestion.pipeline` re-checks a page, by change_frequency, in hours.
# 0 means every run. --force checks every page regardless.
check_interval_hours:
  fast: 0
  medium: 24
  slow: 168

# A page that answers 404 or 410 on this many checks in a row has its files and chunks deleted.
# Fewer failures are only reported, since a site can drop a page briefly.
delete_after_missing_checks: 3

