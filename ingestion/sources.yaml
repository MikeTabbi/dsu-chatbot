# DSU pages the chatbot indexes. See ingestion/README.md for how to add a source.
#
# Fields (all required):
#   url:              full https URL on desu.edu
#   topic:            short lowercase label used to group sources
#   change_frequency: slow | medium | fast  (how often the page content changes)
#   notes:            why this page is here / what questions it answers

sources:
  # Housing
  - url: https://www.desu.edu/student-life/housing-dining
    topic: housing
    change_frequency: medium
    notes: Housing and dining overview; entry point for on-campus housing questions.
  - url: https://www.desu.edu/student-life/housing-dining/residential-halls
    topic: housing
    change_frequency: medium
    notes: List of residence halls.
  - url: https://www.desu.edu/student-life/housing-dining/apply-housing/housing-comparison-matrix
    topic: housing
    change_frequency: slow
    notes: Side-by-side comparison of halls (room types, amenities).
  - url: https://www.desu.edu/student-life/housing-dining/food-service-dining
    topic: housing
    change_frequency: medium
    notes: Dining and meal plans. Dining hours are live data and should not be quoted as fixed.

  # Registration
  - url: https://www.desu.edu/admissions/office-records-registration
    topic: registration
    change_frequency: medium
    notes: Office of Records & Registration; contacts and registration info.
  - url: https://www.desu.edu/about/administration/information-technology/banner-self-service-9-user-guide/registration-planning
    topic: registration
    change_frequency: slow
    notes: Step-by-step class registration in Banner Self-Service.

  # Advising
  - url: https://www.desu.edu/academics/student-success/academic-advisement/advisement-faqs-resources/advising-faqs
    topic: advising
    change_frequency: slow
    notes: Advising FAQs. Used to explain where students find their own advisor (never guess it).
  - url: https://www.desu.edu/academics/student-success/academic-advisement/directory
    topic: advising
    change_frequency: medium
    notes: Academic advisement staff directory.

  # Admissions
  - url: https://www.desu.edu/admissions
    topic: admissions
    change_frequency: medium
    notes: Admissions landing page and office contacts.
  - url: https://www.desu.edu/admissions/apply-now
    topic: admissions
    change_frequency: medium
    notes: How to apply.
  - url: https://www.desu.edu/admissions/admissions-resources
    topic: admissions
    change_frequency: medium
    notes: Admissions resources and forms.
  - url: https://www.desu.edu/admissions/undergraduate-students/how-download-your-satact-score-report
    topic: admissions
    change_frequency: slow
