<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="DSU assistant" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Illustrated DSU assistant: a young Black woman with an afro in a DSU shirt. Brand colors
       from the DSU Branding Tool Kit (Aug 2023): #EE3124 red, #72CDF4 light blue, #009DDC blue. -->
  <defs>
    <clipPath id="c"><circle cx="60" cy="60" r="60"/></clipPath>
    <radialGradient id="hair" cx="45%" cy="35%" r="65%">
      <stop offset="0" stop-color="#4a3226"/>
      <stop offset="1" stop-color="#1e1410"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#c)">
    <rect width="120" height="120" fill="#72CDF4"/>
    <!-- Afro -->
    <g fill="url(#hair)">
      <circle cx="60" cy="46" r="37"/>
      <circle cx="30" cy="40" r="17"/>
      <circle cx="90" cy="40" r="17"/>
      <circle cx="40" cy="20" r="16"/>
      <circle cx="80" cy="20" r="16"/>
      <circle cx="60" cy="13" r="16"/>
      <circle cx="26" cy="60" r="13"/>
      <circle cx="94" cy="60" r="13"/>
    </g>
    <!-- Neck and shirt -->
    <path d="M51 76h18v14H51z" fill="#7a4a2e"/>
    <path d="M14 120c2-20 16-30 34-33l12 7 12-7c18 3 32 13 34 33z" fill="#EE3124"/>
    <path d="M48 87l12 9 12-9-3-2-9 6-9-6z" fill="#ffffff"/>
    <text x="60" y="113" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif"
          font-weight="900" font-size="15" fill="#ffffff" letter-spacing="1">DSU</text>
    <!-- Ears and gold hoop earrings -->
    <ellipse cx="38.5" cy="58" rx="4" ry="6" fill="#8a5636"/>
    <ellipse cx="81.5" cy="58" rx="4" ry="6" fill="#8a5636"/>
    <circle cx="38" cy="67" r="4" fill="none" stroke="#f2c14e" stroke-width="1.8"/>
    <circle cx="82" cy="67" r="4" fill="none" stroke="#f2c14e" stroke-width="1.8"/>
    <!-- Face -->
    <ellipse cx="60" cy="57" rx="21" ry="24" fill="#94603d"/>
    <!-- Hairline over the forehead -->
    <path d="M38 52c0-16 9-25 22-25s22 9 22 25c-4-8-10-13-17-14-3 3-9 5-15 4-5 2-9 5-12 10z" fill="url(#hair)"/>
    <!-- Brows -->
    <path d="M46 50.5c3-2.4 7-2.6 10-1" stroke="#1e1410" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M64 49.5c3-1.6 7-1.4 10 1" stroke="#1e1410" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <!-- Eyes -->
    <ellipse cx="51" cy="57" rx="3.4" ry="4" fill="#1e1410"/>
    <ellipse cx="69" cy="57" rx="3.4" ry="4" fill="#1e1410"/>
    <circle cx="52.2" cy="55.6" r="1.2" fill="#ffffff"/>
    <circle cx="70.2" cy="55.6" r="1.2" fill="#ffffff"/>
    <path d="M47 54.5l-2-1.5M73 54.5l2-1.5" stroke="#1e1410" stroke-width="1.4" stroke-linecap="round"/>
    <!-- Cheeks -->
    <ellipse cx="46" cy="66" rx="4" ry="2.4" fill="#d9776a" opacity="0.45"/>
    <ellipse cx="74" cy="66" rx="4" ry="2.4" fill="#d9776a" opacity="0.45"/>
    <!-- Nose -->
    <path d="M57.5 64c1.5 1.4 3.5 1.4 5 0" stroke="#6b3f26" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <!-- Smile -->
    <path d="M51.5 70c4.5 6 12.5 6 17 0z" fill="#ffffff" stroke="#6e2b22" stroke-width="2" stroke-linejoin="round"/>
  </g>
</svg>
